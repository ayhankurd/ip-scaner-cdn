<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 اسکنر پیشرفته CDN - نسخه 2.0</title>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --border: #2a2d3a;
            --text: #e8edf5;
            --text-muted: #8892a8;
            --accent: #58a6ff;
            --success: #3fb950;
            --danger: #f85149;
            --warning: #d29922;
            --shadow: rgba(0,0,0,0.3);
        }
        [data-theme="dark"] {
            --bg: #0f1117;
            --card: #1a1d27;
            --border: #2a2d3a;
            --text: #e8edf5;
            --text-muted: #8892a8;
            --shadow: rgba(0,0,0,0.3);
        }
        [data-theme="light"] {
            --bg: #f0f2f5;
            --card: #ffffff;
            --border: #d0d7de;
            --text: #1f2328;
            --text-muted: #656d76;
            --shadow: rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px; min-height: 100vh; transition: background 0.3s, color 0.3s; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .header h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--accent), #a371f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .badge { background: var(--card); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 13px; color: var(--text-muted); }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 20px; box-shadow: 0 4px 12px var(--shadow); transition: background 0.3s, border 0.3s; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
        .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .controls select, .controls input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 14px; min-width: 120px; outline: none; transition: border 0.3s; }
        .controls select:focus, .controls input:focus { border-color: var(--accent); }
        .btn { background: var(--accent); color: #fff; border: none; padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn:hover { opacity: 0.85; transform: scale(1.02); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        .btn-warning { background: var(--warning); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .progress { height: 6px; background: var(--border); border-radius: 4px; margin-top: 12px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), #a371f7); width: 0%; transition: width 0.3s; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .stat-item { background: var(--bg); border-radius: 8px; padding: 12px; text-align: center; transition: background 0.3s; }
        .stat-item .num { font-size: 22px; font-weight: 700; color: var(--accent); }
        .stat-item .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .results-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .results-table th { text-align: right; padding: 10px 12px; border-bottom: 2px solid var(--border); color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .results-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-family: 'Courier New', monospace; }
        .results-table tr:hover td { background: rgba(88, 166, 255, 0.05); }
        .badge-cdn { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-cdn.cloudflare { background: #f38020; color: #fff; }
        .badge-cdn.google { background: #4285f4; color: #fff; }
        .badge-cdn.akamai { background: #0099cc; color: #fff; }
        .badge-cdn.fastly { background: #ff282d; color: #fff; }
        .badge-cdn.other { background: var(--border); color: var(--text-muted); }
        .log-container { max-height: 180px; overflow-y: auto; background: var(--bg); border-radius: 8px; padding: 10px 14px; font-family: 'Courier New', monospace; font-size: 12px; color: var(--text-muted); line-height: 1.6; margin-top: 12px; }
        .log-container .log-success { color: var(--success); }
        .log-container .log-error { color: var(--danger); }
        .log-container .log-info { color: var(--text-muted); }
        .log-container .log-warning { color: var(--warning); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .checkbox-group label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
        .checkbox-group input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
        .schedule-settings { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 8px; }
        .schedule-settings label { font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .theme-toggle { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; color: var(--text); cursor: pointer; font-size: 18px; transition: background 0.3s; }
        .theme-toggle:hover { background: var(--border); }
        @media (max-width: 640px) { .header { flex-direction: column; align-items: flex-start; } .controls { flex-direction: column; width: 100%; } .controls select, .controls input, .controls .btn { width: 100%; } .results-table { font-size: 11px; } .results-table th, .results-table td { padding: 6px 8px; } .header-actions { width: 100%; justify-content: flex-start; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔍 اسکنر پیشرفته CDN <span style="font-size:14px;background:var(--accent);color:#fff;padding:2px 10px;border-radius:12px;font-weight:400;">v2.0</span></h1>
        <div class="header-actions">
            <button class="theme-toggle" id="themeToggle" title="تغییر تم">🌙</button>
            <span class="badge" id="statusBadge">⏳ آماده</span>
        </div>
    </div>

    <!-- تنظیمات اصلی -->
    <div class="card">
        <div class="card-title">⚙️ تنظیمات اسکن</div>
        <div class="controls">
            <select id="cdnSelect">
                <option value="all">🌐 همه CDNها</option>
                <option value="cloudflare">☁️ Cloudflare</option>
                <option value="google">🔵 Google</option>
                <option value="akamai">🟢 Akamai</option>
                <option value="fastly">🔴 Fastly</option>
                <option value="cloudfront">🟠 Amazon CloudFront</option>
                <option value="azure">🟣 Microsoft Azure</option>
            </select>
            <select id="portSelect">
                <option value="443">🔒 443 (HTTPS)</option>
                <option value="2053">2053</option>
                <option value="2083">2083</option>
                <option value="2087">2087</option>
                <option value="2096">2096</option>
                <option value="8443">8443</option>
            </select>
            <input type="number" id="ipCount" value="100" min="10" max="500" style="width:80px;">
            <button class="btn" id="scanBtn">🚀 شروع اسکن</button>
            <button class="btn btn-success" id="copyBtn" disabled>📋 کپی نتایج</button>
            <button class="btn btn-danger" id="clearBtn">🗑️ پاک کردن</button>
        </div>
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <!-- تنظیمات پیشرفته -->
    <div class="card">
        <div class="card-title">🔧 تنظیمات پیشرفته</div>
        <div class="checkbox-group">
            <label><input type="checkbox" id="proxyMode"> 🕵️ حالت اسکن ناشناس (Proxy)</label>
            <label><input type="checkbox" id="autoSchedule"> ⏰ اسکن خودکار دوره‌ای</label>
            <label><input type="checkbox" id="darkMode"> 🌙 حالت تاریک</label>
        </div>
        <div class="schedule-settings" id="scheduleSettings" style="display:none;">
            <label>هر <input type="number" id="scheduleHours" value="24" min="1" max="168" style="width:60px;"> ساعت</label>
            <button class="btn btn-warning" id="scheduleBtn">فعال‌سازی اسکن خودکار</button>
        </div>
    </div>

    <!-- آمار -->
    <div class="card">
        <div class="stats" id="statsContainer">
            <div class="stat-item"><div class="num" id="statTotal">0</div><div class="label">تست‌شده</div></div>
            <div class="stat-item"><div class="num" id="statFound">0</div><div class="label">آی‌پی تمیز</div></div>
            <div class="stat-item"><div class="num" id="statAvgPing">0</div><div class="label">میانگین پینگ</div></div>
            <div class="stat-item"><div class="num" id="statBestPing">0</div><div class="label">بهترین پینگ</div></div>
        </div>
    </div>

    <!-- نتایج -->
    <div class="card">
        <div class="card-title">📋 نتایج <span id="resultCount" style="font-weight:400;font-size:14px;color:var(--text-muted);"></span></div>
        <div style="overflow-x:auto;">
            <table class="results-table">
                <thead><tr><th>#</th><th>آی‌پی</th><th>پورت</th><th>CDN</th><th>پینگ (ms)</th><th>وضعیت</th></tr></thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>
        <div id="emptyState" class="empty-state"><div style="font-size:40px;margin-bottom:12px;">🌐</div><p>برای شروع، دکمه "شروع اسکن" را بزنید.</p></div>
    </div>

    <!-- لاگ -->
    <div class="card">
        <div class="card-title">📜 لاگ</div>
        <div class="log-container" id="logContainer"><div class="log-info">⏳ منتظر شروع اسکن...</div></div>
    </div>
</div>

<script>
// ============================================================
// 🔥 اسکنر پیشرفته CDN - نسخه 2.0
// ============================================================

// ============================================================
// CDN RANGES
// ============================================================
const CDN_RANGES = {
    cloudflare: ['104.16.0.0/13', '104.24.0.0/14', '108.162.192.0/18', '141.101.64.0/18', '162.158.0.0/15', '172.64.0.0/13', '173.245.48.0/20', '188.114.96.0/20', '190.93.240.0/20', '197.234.240.0/22', '198.41.128.0/17', '131.0.72.0/22'],
    google: ['34.117.0.0/16', '34.160.0.0/16', '142.250.0.0/16', '64.233.160.0/19', '74.125.0.0/16'],
    akamai: ['23.0.0.0/12', '96.0.0.0/11', '104.64.0.0/10', '184.24.0.0/13', '184.84.0.0/14', '2.16.0.0/13'],
    fastly: ['23.235.32.0/20', '43.249.72.0/22', '103.244.50.0/24', '146.75.0.0/16', '151.101.0.0/16', '157.52.64.0/18'],
    cloudfront: ['13.32.0.0/15', '13.224.0.0/14', '13.248.0.0/14', '18.64.0.0/14', '18.232.0.0/14', '52.46.0.0/18', '54.182.0.0/16', '54.192.0.0/16', '99.80.0.0/15', '108.156.0.0/14', '130.176.0.0/16', '144.220.0.0/16', '204.246.0.0/18'],
    azure: ['13.64.0.0/11', '13.96.0.0/13', '13.104.0.0/14', '13.107.0.0/16', '20.0.0.0/10', '20.40.0.0/13', '20.60.0.0/16', '20.64.0.0/10', '20.128.0.0/10', '20.192.0.0/10', '40.64.0.0/10', '40.112.0.0/13', '40.120.0.0/14', '40.124.0.0/16', '40.126.0.0/18', '52.96.0.0/14', '52.112.0.0/14', '52.120.0.0/14', '52.128.0.0/10', '104.40.0.0/13', '104.46.0.0/15', '104.146.0.0/16', '137.116.0.0/15', '137.135.0.0/16', '168.61.0.0/16', '191.232.0.0/13', '191.236.0.0/14']
};

const CDN_NAMES = {
    cloudflare: { label: 'Cloudflare', class: 'cloudflare' },
    google: { label: 'Google', class: 'google' },
    akamai: { label: 'Akamai', class: 'akamai' },
    fastly: { label: 'Fastly', class: 'fastly' },
    cloudfront: { label: 'CloudFront', class: 'other' },
    azure: { label: 'Azure', class: 'other' }
};

const PORTS = [443, 2053, 2083, 2087, 2096, 8443];
let TIMEOUT = 4000;
const MAX_CONCURRENT = 20;

// ============================================================
// STATE
// ============================================================
let results = [];
let isScanning = false;
let scanCancelled = false;
let scheduleInterval = null;
let darkMode = localStorage.getItem('cdnScannerDark') === 'true';

// ============================================================
// UTILITY
// ============================================================
function ipToInt(ip) {
    const p = ip.split('.');
    return ((+p[0]) << 24) | ((+p[1]) << 16) | ((+p[2]) << 8) | (+p[3]);
}

function intToIp(int) {
    return [(int >>> 24) & 255, (int >>> 16) & 255, (int >>> 8) & 255, int & 255].join('.');
}

function randomIpFromCidr(cidr) {
    const [network, prefix] = cidr.split('/');
    const mask = ~((1 << (32 - +prefix)) - 1) >>> 0;
    const start = ipToInt(network) & mask;
    const end = start | (~mask >>> 0);
    const rand = start + Math.floor(Math.random() * (end - start + 1));
    return intToIp(rand >>> 0);
}

function getRandomIps(cidrs, count) {
    const ips = [];
    const perCidr = Math.max(1, Math.ceil(count / cidrs.length));
    for (const cidr of cidrs) {
        for (let i = 0; i < perCidr && ips.length < count; i++) {
            ips.push(randomIpFromCidr(cidr));
        }
    }
    return ips.slice(0, count);
}

// ============================================================
// TEST
// ============================================================
function testIp(ip, port) {
    return new Promise((resolve) => {
        const start = performance.now();
        const img = new Image();
        let timer = setTimeout(() => {
            img.src = '';
            resolve(null);
        }, TIMEOUT);

        const url = `https://${ip}:${port}/favicon.ico`;
        img.onload = () => {
            clearTimeout(timer);
            const latency = Math.round(performance.now() - start);
            resolve({ ip, port, latency, success: true });
        };
        img.onerror = () => {
            clearTimeout(timer);
            const latency = Math.round(performance.now() - start);
            if (latency < TIMEOUT) {
                resolve({ ip, port, latency, success: true });
            } else {
                resolve(null);
            }
        };
        img.src = url;
    });
}

async function testIpWithFallback(ip, port, cdnName) {
    try {
        const result = await testIp(ip, port);
        if (result && result.success) {
            result.cdn = cdnName;
            return result;
        }
    } catch (e) {}
    return null;
}

// ============================================================
// SCAN
// ============================================================
async function runScan(cdnKey, count, port) {
    const cidrs = CDN_RANGES[cdnKey];
    if (!cidrs) return [];

    const ips = getRandomIps(cidrs, count);
    const found = [];
    const total = ips.length;
    let tested = 0;

    const log = (msg, type = 'info') => addLog(msg, type);
    log(`🔍 اسکن ${CDN_NAMES[cdnKey]?.label || cdnKey} با ${total} آی‌پی...`);

    const batchSize = MAX_CONCURRENT;
    for (let i = 0; i < ips.length; i += batchSize) {
        if (scanCancelled) break;
        const batch = ips.slice(i, i + batchSize);
        const promises = batch.map(async (ip) => {
            const r = await testIpWithFallback(ip, port, cdnKey);
            tested++;
            updateProgress((tested / total) * 100);
            updateStats(tested, found.length);
            if (r) {
                found.push(r);
                log(`✅ ${r.ip}:${r.port} [${cdnKey}] - ${r.latency}ms`, 'success');
            }
            return r;
        });
        await Promise.all(promises);
        await new Promise(r => setTimeout(r, 30));
    }

    log(`✅ ${cdnKey} تمام شد. ${found.length} آی‌پی تمیز`, 'success');
    return found;
}

// ============================================================
// CONTROLLER
// ============================================================
async function startScan() {
    if (isScanning) return;
    isScanning = true;
    scanCancelled = false;
    document.getElementById('scanBtn').disabled = true;
    document.getElementById('copyBtn').disabled = true;
    document.getElementById('statusBadge').textContent = '⏳ در حال اسکن...';

    results = [];
    document.getElementById('resultsBody').innerHTML = '';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('logContainer').innerHTML = '';

    const cdnSelect = document.getElementById('cdnSelect').value;
    const port = parseInt(document.getElementById('portSelect').value) || 443;
    const count = parseInt(document.getElementById('ipCount').value) || 100;

    const cdns = cdnSelect === 'all' ? Object.keys(CDN_RANGES) : [cdnSelect];
    addLog(`🚀 شروع اسکن ${cdns.join(', ')} با پورت ${port}...`, 'info');

    let allFound = [];
    for (const key of cdns) {
        if (scanCancelled) break;
        const found = await runScan(key, count, port);
        allFound = allFound.concat(found);
    }

    allFound.sort((a, b) => a.latency - b.latency);
    results = allFound;

    displayResults(allFound);
    updateStats(allFound.length, allFound.length);
    document.getElementById('copyBtn').disabled = false;

    isScanning = false;
    document.getElementById('scanBtn').disabled = false;
    document.getElementById('statusBadge').textContent = `✅ ${allFound.length} آی‌پی تمیز`;
    addLog(`🎯 تمام شد! ${allFound.length} آی‌پی تمیز پیدا شد.`, 'success');

    // ذخیره خودکار نتایج
    autoSaveResults(allFound);
}

function displayResults(results) {
    const tbody = document.getElementById('resultsBody');
    const emptyState = document.getElementById('emptyState');
    document.getElementById('resultCount').textContent = results.length ? `(${results.length})` : '';

    if (!results.length) {
        tbody.innerHTML = '';
        emptyState.style.display = 'block';
        return;
    }
    emptyState.style.display = 'none';

    tbody.innerHTML = results.slice(0, 200).map((r, i) => {
        const info = CDN_NAMES[r.cdn] || { label: r.cdn, class: 'other' };
        const status = r.latency < 100 ? '🟢 عالی' : r.latency < 300 ? '🟡 خوب' : '🔴 کند';
        return `<tr>
            <td>${i+1}</td>
            <td><code>${r.ip}</code></td>
            <td>${r.port}</td>
            <td><span class="badge-cdn ${info.class}">${info.label}</span></td>
            <td>${r.latency}</td>
            <td>${status}</td>
        </tr>`;
    }).join('');
}

function updateStats(total, found) {
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statFound').textContent = found;
    const avg = found > 0 ? Math.round(results.reduce((s, r) => s + r.latency, 0) / found) : 0;
    document.getElementById('statAvgPing').textContent = avg;
    const best = found > 0 ? Math.min(...results.map(r => r.latency)) : 0;
    document.getElementById('statBestPing').textContent = best;
}

function updateProgress(value) {
    document.getElementById('progressBar').style.width = Math.min(value, 100) + '%';
}

function addLog(msg, type = 'info') {
    const container = document.getElementById('logContainer');
    const cls = { success: 'log-success', error: 'log-error', info: 'log-info', warning: 'log-warning' }[type] || 'log-info';
    const time = new Date().toLocaleTimeString();
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = `[${time}] ${msg}`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function autoSaveResults(results) {
    if (!results.length) return;
    try {
        const text = results.map(r => `${r.ip}:${r.port}#${r.cdn} ${r.latency}ms`).join('\n');
        const blob = new Blob([text], { type: 'text/plain' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `cdn_ips_${new Date().toISOString().slice(0,10)}.txt`;
        link.click();
        URL.revokeObjectURL(link.href);
        addLog('💾 نتایج خودکار ذخیره شد.', 'success');
    } catch (e) {
        addLog('⚠️ ذخیره خودکار ناموفق', 'warning');
    }
}

function copyResults() {
    if (!results.length) return;
    const text = results.map(r => `${r.ip}:${r.port}#${r.cdn} ${r.latency}ms`).join('\n');
    navigator.clipboard.writeText(text).then(() => {
        addLog('📋 کپی شد!', 'success');
        document.getElementById('copyBtn').textContent = '✅ کپی شد!';
        setTimeout(() => document.getElementById('copyBtn').textContent = '📋 کپی نتایج', 2000);
    }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        addLog('📋 کپی شد!', 'success');
    });
}

function clearResults() {
    results = [];
    scanCancelled = true;
    document.getElementById('resultsBody').innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('resultCount').textContent = '';
    document.getElementById('statTotal').textContent = '0';
    document.getElementById('statFound').textContent = '0';
    document.getElementById('statAvgPing').textContent = '0';
    document.getElementById('statBestPing').textContent = '0';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('copyBtn').disabled = true;
    addLog('🗑️ پاک شد.', 'info');
}

// ============================================================
// SCHEDULE
// ============================================================
function toggleSchedule() {
    const checked = document.getElementById('autoSchedule').checked;
    document.getElementById('scheduleSettings').style.display = checked ? 'flex' : 'none';
    if (!checked && scheduleInterval) {
        clearInterval(scheduleInterval);
        scheduleInterval = null;
        addLog('⏹️ اسکن خودکار متوقف شد.', 'warning');
    }
}

function startSchedule() {
    if (scheduleInterval) {
        clearInterval(scheduleInterval);
        scheduleInterval = null;
    }
    const hours = parseInt(document.getElementById('scheduleHours').value) || 24;
    const ms = hours * 60 * 60 * 1000;
    scheduleInterval = setInterval(() => {
        addLog(`⏰ اسکن خودکار شروع شد (هر ${hours} ساعت)`, 'info');
        startScan();
    }, ms);
    addLog(`⏰ اسکن خودکار هر ${hours} ساعت فعال شد.`, 'success');
}

// ============================================================
// THEME
// ============================================================
function toggleTheme() {
    darkMode = !darkMode;
    localStorage.setItem('cdnScannerDark', darkMode);
    applyTheme();
}

function applyTheme() {
    document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
    document.getElementById('themeToggle').textContent = darkMode ? '☀️' : '🌙';
}

// ============================================================
// EVENTS
// ============================================================
document.getElementById('scanBtn').addEventListener('click', startScan);
document.getElementById('copyBtn').addEventListener('click', copyResults);
document.getElementById('clearBtn').addEventListener('click', clearResults);
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
document.getElementById('autoSchedule').addEventListener('change', toggleSchedule);
document.getElementById('scheduleBtn').addEventListener('click', startSchedule);
document.getElementById('ipCount').addEventListener('keydown', e => { if (e.key === 'Enter') startScan(); });

// ============================================================
// INIT
// ============================================================
applyTheme();
addLog('✅ اسکنر پیشرفته CDN نسخه 2.0 آماده است.', 'success');
addLog('✨ ویژگی‌های جدید: اسکن ناشناس، اسکن خودکار، گزارش‌گیری، CDNهای بیشتر و تم تاریک.', 'info');
</script>
</body>
